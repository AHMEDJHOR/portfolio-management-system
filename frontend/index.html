<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Ahmed Jhor | Portfolio</title>
    <script>
      // Resolve the theme before first paint to avoid a flash of the wrong theme.
      // The storage key must match STORAGE_KEY in ThemeProvider.tsx.
      (function () {
        var theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
